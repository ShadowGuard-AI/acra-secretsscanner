<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="The moss garden in three bands: canopy light drifting at the top, fern fronds uncurling and mushroom caps brightening in sequence in the middle, and the moss field below where bright points fade as the surface dries and one drop falls in a long cycle">
